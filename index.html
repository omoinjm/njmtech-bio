<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@nhlanhlamalaza_ | Bio</title>
  <meta name="description" content="Links to my social media and services I offer.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, hsl(280 70% 35%), hsl(230 50% 18%), hsl(260 40% 12%));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e8ecf2;
      padding: 3rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 28rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .avatar-ring {
      border-radius: 50%;
      padding: 3px;
      background: hsl(185 80% 55%);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .bio {
      color: hsl(215 20% 65%);
      font-size: 0.875rem;
      text-align: center;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 0.75rem;
      background: hsla(220, 40%, 60%, 0.15);
      border: 1px solid hsla(220, 40%, 70%, 0.2);
      backdrop-filter: blur(12px);
      text-decoration: none;
      color: #e8ecf2;
      transition: all 0.3s ease;
    }

    .link-card:hover {
      background: hsla(220, 40%, 60%, 0.25);
      transform: scale(1.02);
      box-shadow: 0 8px 30px -10px rgba(0,0,0,0.3);
    }

    .link-card svg {
      width: 20px;
      height: 20px;
      color: hsl(185 80% 55%);
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .link-card span {
      flex: 1;
      text-align: center;
      font-weight: 500;
      font-size: 0.875rem;
      padding-right: 2.25rem;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-top: 0.5rem;
    }

    .socials a {
      color: hsl(215 20% 65%);
      transition: color 0.2s;
    }

    .socials a:hover {
      color: #e8ecf2;
    }

    .socials svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
